services:
  php-dev81:
    build:
      context: .
      dockerfile_inline: |
        FROM php:8.1-apache
        # Install system dependencies for GD, Intl, and Imagick
        RUN apt-get update && apt-get install -y \
            git unzip zip \
            libpng-dev libjpeg-dev libfreetype6-dev \
            libicu-dev \
            libmagickwand-dev --no-install-recommends

        # Install PHP extensions
        RUN docker-php-ext-configure gd --with-freetype --with-jpeg \
            && docker-php-ext-install -j$(nproc) mysqli intl exif gd

        # Install Imagick (requires pecl)
        RUN pecl install imagick && docker-php-ext-enable imagick

        # Enable mod_rewrite and allow .htaccess overrides for the router
        RUN a2enmod rewrite \
            && sed -ri -e 's!AllowOverride None!AllowOverride All!g' /etc/apache2/apache2.conf

        # Copy composer
        COPY --from=composer:latest /usr/bin/composer /usr/bin/composer
    volumes:
      - .:/var/www/html
    ports:
      - "8080:80"
    working_dir: /var/www/html
    dns:
      - 8.8.8.8
      - 8.8.4.4
    # logs/ is bind-mounted from the host, so its ownership/perms come from
    # the host filesystem, not the image - make sure the www-data worker
    # processes can actually write to it before starting Apache.
    command: >
      bash -c "mkdir -p /var/www/html/logs && chmod 777 /var/www/html/logs && apache2-foreground"
